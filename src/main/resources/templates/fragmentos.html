<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="cabecalho(titulo)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- responsivo -->
  <title th:text="${titulo}">Conecta Bairro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:fragment="topo" class="topo">
  <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
    <a th:href="@{/}" class="logo">Conecta Bairro</a>
    <div class="d-flex flex-wrap gap-2 align-items-center">
      <!-- sec:authorize mostra os botões conforme o usuário esteja logado ou não -->
      <!-- VISITANTE: Entrar + Criar Conta -->
      <a sec:authorize="!isAuthenticated()" th:href="@{/login}" class="btn btn-outline-light">Entrar</a>
      <a sec:authorize="!isAuthenticated()" th:href="@{/registrar}" class="btn btn-laranja">Criar Conta</a>
      <!-- LOGADO: Meus Comércios + Sair (o logout é um POST, por isso é um formulário) -->
      <a sec:authorize="isAuthenticated()" th:href="@{/meu-painel}" class="btn btn-laranja">Meus Comércios</a>
      <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="m-0">
        <button class="btn btn-outline-light">Sair</button>
      </form>
    </div>
  </div>
</header>
<div th:fragment="avisos" class="container mt-3">
  <div th:if="${ok}" class="alert alert-success fs-5" th:text="${ok}"></div>
  <div th:if="${erro}" class="alert alert-danger fs-5" th:text="${erro}"></div>
</div>
</body>
</html>
