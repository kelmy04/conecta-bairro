# ============================================================
# Conecta Bairro - configuração
# Em produção, tudo o que é segredo vem de VARIÁVEIS DE AMBIENTE (nada de senha no código).
# O que está depois de ":" é o valor usado quando a variável não existe (ambiente local).
# ============================================================

# ---- Banco de dados ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/conecta-bairro}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
# update cria/ajusta as tabelas sozinho. Quando o banco estiver estável, pode-se usar "validate".
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
# Poucas conexões: hospedagens e bancos gratuitos têm memória e limite de conexões pequenos
spring.datasource.hikari.maximum-pool-size=${DB_POOL:5}
spring.datasource.hikari.minimum-idle=1

# ---- Servidor ----
# A hospedagem define a porta pela variável PORT
server.port=${PORT:8080}
# Atrás do proxy HTTPS da hospedagem: respeita os cabeçalhos X-Forwarded-* (links e redirecionamentos corretos)
server.forward-headers-strategy=framework
# Em produção (com HTTPS) defina COOKIE_SECURE=true: o cookie de login só trafega criptografado
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# ---- Upload de imagens ----
# As fotos são guardadas NO BANCO (tabela "imagem"), por isso não há mais pasta de uploads nem disco para configurar.
# O limite de 3 MB por imagem é aplicado no ArmazenamentoService (mensagem amigável);
# os valores abaixo são apenas o teto técnico do Spring.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ---- Configuração local (opcional) ----
# Se existir, o arquivo application-local.properties (da sua máquina) tem prioridade sobre os valores acima.
spring.config.import=optional:classpath:application-local.properties
